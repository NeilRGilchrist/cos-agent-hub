# Pytest configuration.
#
# pythonpath: puts `scripts/` on sys.path so the infrastructure tests under
# `tests/unit/scripts/` can import sibling modules by name (e.g.
# `spec_footprint`), the same way the team scripts import each other. Paths are
# resolved relative to rootdir. Requires pytest 7.0+.
#
# Having a config file here also pins pytest's rootdir to the project root.
# Without one, pytest walks upward and can settle on a parent directory's
# config -- e.g. the workspace hub's `pyproject.toml` when the project lives in
# `projects/<name>/` -- which makes local runs disagree with CI.
#
# This file is stack-independent: `scripts/` and its tests are team
# infrastructure and are always Python, whatever the project's own stack is.
[pytest]
pythonpath = scripts
